{% extends "employe/base.html" %}

{% block content %}
    <div class="w-fuu bg-base-200">
        <div>
            <a href="http://" class="btn btn-primary w-full">Ajouter un employé</a>
        </div>
        <div class="space-y-4 w-full">
            {% for emp in employes %}
            <div class="p-4 bg-base-100 rounded-lg w-full flex justify-between item-center">
                <div class="space-y-2">
                    <p class="font-bold text-lg"> Nom Complet : {{ emp.nom }}</p>
                     <p class="font-bold text-lg"> Fonction : {{ emp.poste }}</p>
                     <p class="badge badge-soft badge-primary"> E-mail : {{ emp.email }}</p>
                    {% empty %}
                     <p>Aucun employé trouvé.</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
