{% extends 'employe/base.html' %}

{% block content %}
<form action="" method="post" class="space-y-4">
    {%csrf_token %}
    {{ form.nom }}
    {{ form.email }}
    {{ form.poste }}
    {{ form.salaire }}
    <div class="flex mt-4">
    <button type="submit" class="btn btn-primary mr-4">Enregistrer</button>
    <a href="{% url 'liste_employes' %}" class="btn btn-error">Annuler</a>
    </div>
</form>
{% endblock %}
